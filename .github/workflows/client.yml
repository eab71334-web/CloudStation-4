name: Build client

on:
  workflow_dispatch:
  push:
    paths: ["client/**"]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --platforms=android .
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: client-apk
          path: client/build/app/outputs/flutter-apk/app-release.apk

  ipa:
    runs-on: macos-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --platforms=ios .
      - run: flutter pub get
      - run: flutter build ios --config-only --release --no-codesign
      - run: |
          if [ -f ios/Podfile ]; then (cd ios && pod install); fi
      - run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - run: |
          mkdir Payload
          cp -r "$(find build -type d -name Runner.app -path "*Release-iphoneos*" | head -n 1)" Payload/
          zip -r client.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: client-ipa
          path: client/client.ipa